apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: roboshop
  region: us-east-1
  version: "1.34"

autoModeConfig:
  enabled: false

managedNodeGroups:
  - name: managed
    instanceTypes:
      - t3.micro
      - t2.micro
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 40
    spot: true

